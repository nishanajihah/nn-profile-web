<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Warm Radiant Orange Gradient Background -->
    <linearGradient id="rkBgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8c00"/>
      <stop offset="50%" stop-color="#ff6a00"/>
      <stop offset="100%" stop-color="#e63900"/>
    </linearGradient>

    <!-- Subtle Inner Glow Ring -->
    <linearGradient id="rkRingGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Drop Shadow Filter for 4-Grid App Icons -->
    <filter id="rkShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    <!-- Sparkle Glow Filter -->
    <filter id="rkGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ffffff" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Squircle Rounded Orange Background Container -->
  <rect x="0" y="0" width="512" height="512" rx="128" ry="128" fill="url(#rkBgGradient)"/>

  <!-- Inner Ambient Highlight Ring -->
  <rect x="12" y="12" width="488" height="488" rx="116" ry="116" fill="none" stroke="url(#rkRingGlow)" stroke-width="6"/>

  <!-- 4-Grid App Module Symbols (Random Kit Utilities & Arcade) -->
  <g filter="url(#rkShadow)">
    <!-- Top-Left: Wheel Spinner / Dice Dot (White Pill) -->
    <rect x="128" y="128" width="112" height="112" rx="32" ry="32" fill="#ffffff"/>
    
    <!-- Top-Right: Color Memory Arcade (White Pill) -->
    <rect x="272" y="128" width="112" height="112" rx="32" ry="32" fill="#ffffff"/>
    
    <!-- Bottom-Left: Color Mixer / Coin Flip (White Pill) -->
    <rect x="128" y="272" width="112" height="112" rx="32" ry="32" fill="#ffffff"/>
    
    <!-- Bottom-Right: Tic Tac Toe Arcade (White Pill) -->
    <rect x="272" y="272" width="112" height="112" rx="32" ry="32" fill="#ffffff"/>
  </g>

  <!-- Center "+" Plus Badge Accent -->
  <circle cx="256" cy="256" r="38" fill="#1e1104" filter="url(#rkShadow)"/>
  <circle cx="256" cy="256" r="34" fill="#ff7d00"/>
  <path d="M256 238 v36 M238 256 h36" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>

  <!-- Four Floating Corner Sparkles ✨ -->
  <path d="M120 100 L124 116 L140 120 L124 124 L120 140 L116 124 L100 120 L116 116 Z" fill="#ffffff" filter="url(#rkGlow)"/>
  <path d="M392 380 L395 391 L406 394 L395 397 L392 408 L389 397 L378 394 L389 391 Z" fill="#ffffff" filter="url(#rkGlow)"/>
</svg>
